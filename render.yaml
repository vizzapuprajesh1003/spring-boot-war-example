databases:
  - name: unplug-db
    databaseName: unplug
    plan: free

services:
  - type: web
    name: unplug
    runtime: docker
    plan: free
    healthCheckPath: /api/user/status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unplug-db
          property: connectionString
