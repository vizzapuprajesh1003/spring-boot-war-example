spring.application.name=unplug-app
# Render sets PORT env var; fallback to 8080 locally
server.port=${PORT:8080}

# H2 file-based database — data persists between restarts
spring.datasource.url=jdbc:h2:file:/tmp/unplug/data
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Load challenge seed data only when the table is empty (handled in ChallengeService)
spring.sql.init.mode=never

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
