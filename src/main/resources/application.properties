spring.application.name=unplug-app
# Render sets PORT env var; fallback to 8080 locally
server.port=${PORT:8080}

# In-memory H2 for cloud deployments; add a PostgreSQL service on Railway to get persistence
spring.datasource.url=jdbc:h2:mem:unplug;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Load challenge seed data only when the table is empty (handled in ChallengeService)
spring.sql.init.mode=never

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
